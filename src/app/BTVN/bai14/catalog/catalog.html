<p>catalog works!</p>

<table border="1">
    <thead>
        <tr>
            <td>Ma Danh Muc</td>
            <td colspan="3">Ten Danh Muc</td>
        </tr>
    </thead>
    <tbody>
        @for (cate of categories; track cate.Cateid) {
            <tr>
                <td>{{ cate.Cateid }}</td>
                <td colspan="3">{{ cate.CateName }}</td>
            </tr>

            <!-- Hàng tiêu đề các cột của sản phẩm -->
            <tr>
                <td>Ma San Pham</td>
                <td>Ten San Pham</td>
                <td>Gia San Pham</td>
                <td>Picture</td>
            </tr>

            <!-- Vòng lặp 2: Duyệt danh sách sản phẩm thuộc danh mục -->
            @for (p of cate.Products; track p.ProductId) {
                <tr>
                    <td>{{ p.ProductId }}</td>
                    <td>{{ p.ProductName }}</td>
                    <td>{{ p.Price }}</td>
                    <td>
                        <img [src]="p.Image" [alt]="p.ProductName" width="100" height="100">
                    </td>
                </tr>
            }
        }
    </tbody>
</table>

<p>product-list-call-http-service-component works!</p>
<table border="1">
    <thead>
        <tr>
            <td>Id</td>
            <td>Name</td>
            <td>Price</td>
        </tr>
    </thead>
    <tbody>
       @for (product of products(); track product.id){
       <tr> 
       
            <td> {{product.id}}</td>
            <td> {{product.name}}</td>
            <td> {{product.price}}</td>
            <td><img [src]="product.image" [alt]="product.name" width="100" height="100"></td>
        </tr>
    }
    @empty {
        <tr> 
            <td colspan="4">No products available</td>
        </tr>
    }
    </tbody>
</table>

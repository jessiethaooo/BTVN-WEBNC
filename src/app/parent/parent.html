<div style="border: 2px solid #28a745; padding: 20px; margin: 20px;">
  <h2>Parent Component</h2>
  <p *ngIf="dataFromChild">Dữ liệu từ Con gửi lên: <strong>{{ dataFromChild }}</strong></p>

  <!-- Gọi Component Con ra hiển thị -->
  <app-child 
    [parentData]="data" 
    (childEvent)="handleMessage($event)">
  </app-child>
</div>
